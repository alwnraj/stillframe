# Stillframe on Cloudflare Workers (free plan). Deploy: npx wrangler deploy
name = "stillframe"
main = "worker/index.js"
compatibility_date = "2026-11-01"
# enable_request_signal lets a client disconnect abort collection inside the Durable Object.
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = true
preview_urls = false

# The Worker runs first so every file gets no-store and the CSP headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# One in-memory state object. SQLite-backed classes are required on the free
# plan, but the code never reads or writes storage.
[[durable_objects.bindings]]
name = "STATE"
class_name = "StillframeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StillframeState"]

# Non-retention: no invocation logs, traces or tail consumers.
[observability]
enabled = false
